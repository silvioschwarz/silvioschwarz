name: Deploy Main Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main repo & submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare data & build static site
        run: npm run build

      # Prüft, wo der Build liegt, und kopiert ihn bei Bedarf nach ./dist
      - name: Prepare Pages directory
        run: |
          if [ -d "build/client" ]; then
            rm -rf dist
            cp -rL build/client dist
          fi
          ls -la dist

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v3
        with:
          name: github-pages
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4